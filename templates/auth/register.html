{% extends "base.html" %}
{% block title %}Create Your Account - UniGuide Uganda{% endblock %}
{% block content %}

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <h1>Create Your Account</h1>
        <p class="muted center">Join UniGuide Uganda to match your grades to the right course and university.</p>

        <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" value="{{ name }}" required autocomplete="name" placeholder="e.g. Aisha Nakato">
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password" placeholder="Repeat your password">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>

{% endblock %}
